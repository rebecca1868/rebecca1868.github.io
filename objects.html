<style>
  /* 沒有刊頭的頁面：導覽列一開始就是實心、跟著頁面捲動 */
  header { position: sticky; }
  /* 分類頁開頭（平面設計、插畫共用）：英文分類名 */
  .page-title { padding: clamp(48px, 7vw, 96px) var(--gutter) 0; max-width: 1440px; margin: 0 auto; display: flex; justify-content: space-between; align-items: flex-end; gap: 24px; }
  .page-title h1 { font-family: "Inter", sans-serif; font-weight: 300; font-size: clamp(28px, 3.2vw, 44px); line-height: 1.15; letter-spacing: .04em; }

  /* 大小滑桿：往左欄數變多、圖片變小；往右欄數變少、圖片變大 */
  .zoom { display: flex; align-items: center; gap: 12px; color: var(--muted); padding-bottom: 6px; }
  .zoom svg { width: 14px; height: 14px; flex: none; }
  .zoom input { -webkit-appearance: none; appearance: none; width: 120px; height: 20px; background: transparent; cursor: pointer; }
  .zoom input::-webkit-slider-runnable-track { height: 1px; background: var(--muted); }
  .zoom input::-moz-range-track { height: 1px; background: var(--muted); }
  .zoom input::-webkit-slider-thumb { -webkit-appearance: none; width: 12px; height: 12px; margin-top: -5.5px; border-radius: 50%; background: var(--ink); border: 0; transition: transform .2s; }
  .zoom input::-moz-range-thumb { width: 12px; height: 12px; border-radius: 50%; background: var(--ink); border: 0; }
  .zoom input:hover::-webkit-slider-thumb { transform: scale(1.25); }
  .zoom input:focus-visible { outline: 1px solid var(--ink); outline-offset: 4px; }
  /* 切換欄數時，每張圖平順移到新位置：不做淡入淡出（避免新舊兩層疊成殘影），只移動、縮放新的那層 */
  ::view-transition-group(*.tile) { animation-duration: .45s; animation-timing-function: cubic-bezier(.2,.7,.2,1); }
  ::view-transition-old(*.tile) { animation: none; opacity: 0; }
  ::view-transition-new(*.tile) { animation: none; opacity: 1; width: 100%; height: 100%; }
  ::view-transition-old(root), ::view-transition-new(root) { animation: none; }  /* 瀑布流：依每張插畫的原比例錯落排列，圓角、較小的間距 */
  .wall { --cols: 3; column-count: var(--cols); column-gap: 12px; padding: 40px var(--gutter) 120px; max-width: 1440px; margin: 0 auto; }
  .tile { break-inside: avoid; margin-bottom: 12px; position: relative; overflow: hidden; border-radius: var(--r); }
  .tile img { transition: transform .8s cubic-bezier(.2,.7,.2,1); }
  /* 滑過去時：整張插畫蒙上一層霧面玻璃，作品名稱清楚浮在中間 */
  .tile figcaption {
    position: absolute; inset: 0; margin: 0; pointer-events: none;
    display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 4px;
    color: var(--ink); font-family: "Noto Sans TC"; font-size: 16px; font-weight: 500; letter-spacing: .12em;
    background: rgba(245,244,242,.38);
    -webkit-backdrop-filter: blur(8px) saturate(1.1); backdrop-filter: blur(8px) saturate(1.1);
    opacity: 0; transition: opacity .5s ease;
  }
  .tile figcaption small { font-size: 11px; font-weight: 400; letter-spacing: .2em; color: #5f5d58; }
  .tile figcaption .hint { display: none; margin-top: 10px; font-size: 11px; font-weight: 400; letter-spacing: .2em; color: #5f5d58; }
  @media (hover: hover) { .tile:hover figcaption { opacity: 1; } .tile:hover img { transform: scale(1.03); } }
  /* 觸控裝置沒有「滑過去」：點第一下出現霧面，再點一下放大 */
  @media (hover: none) {
    .tile.show figcaption { opacity: 1; }
    .tile figcaption .hint { display: block; }
  }
  /* ===== 實體頁的滑過效果：不霧化整張圖 ===== */
  /* 名稱改成左下角的小霧面標籤 */
  .tile figcaption {
    inset: auto auto 12px 12px; padding: 6px 12px; border-radius: 999px; gap: 0;
    flex-direction: row; align-items: baseline; font-size: 13px; letter-spacing: .08em;
    background: rgba(245,244,242,.78); -webkit-backdrop-filter: blur(10px); backdrop-filter: blur(10px);
    transform: translateY(6px); transition: opacity .35s ease, transform .35s ease;
  }
  .tile figcaption small { margin-left: 10px; font-size: 11px; }
  .tile.show figcaption { transform: none; }
  .tile figcaption { z-index: 2; }
  @media (hover: hover) { .tile:hover figcaption { transform: none; } }
  /* 多張照片的作品：卡片裡可以左右滑動，下方小圓點表示第幾張 */
  .strip { display: flex; overflow-x: auto; overflow-y: hidden; scroll-snap-type: x mandatory; scrollbar-width: none; overscroll-behavior-x: contain; cursor: grab; }
  .strip::-webkit-scrollbar { display: none; }
  .strip.dragging { scroll-snap-type: none; cursor: grabbing; }
  .strip img { flex: 0 0 100%; width: 100%; height: 100%; object-fit: cover; scroll-snap-align: start; -webkit-user-drag: none; user-select: none; }
  .has-strip:hover .strip img { transform: none; }
  .dots { position: absolute; left: 0; right: 0; bottom: 14px; z-index: 1; display: flex; justify-content: center; gap: 6px; pointer-events: none; }
  .dots i { width: 6px; height: 6px; border-radius: 50%; background: rgba(255,255,255,.65); box-shadow: 0 0 0 1px rgba(0,0,0,.12); transition: background .3s, transform .3s; }
  .dots i.on { background: #fff; transform: scale(1.25); }
  /* 名稱標籤出現時，小圓點往上讓位 */
  @media (hover: hover) { .has-strip:hover .dots { bottom: 52px; } }
  .has-strip.show .dots { bottom: 52px; }
  @container (max-width: 320px) { .has-strip:hover .dots, .has-strip.show .dots { bottom: 44px; } }
  @container (max-width: 200px) { .has-strip:hover .dots, .has-strip.show .dots { bottom: 38px; } }
  .dots { transition: bottom .35s ease; }  /* 名稱標籤跟著卡片寬度縮放：卡片變窄時字變小、超出的字以「…」收尾，太窄就只留名稱 */
  .tile { container-type: inline-size; }
  .tile figcaption { max-width: calc(100% - 24px); white-space: nowrap; overflow: hidden; text-overflow: ellipsis; display: block; }
  .tile figcaption small { display: inline; }
  .tile figcaption .hint { display: none !important; }   /* 標籤空間小，不放「再點一下放大」 */
  @container (max-width: 320px) {
    .tile figcaption { font-size: 12px; padding: 5px 10px; left: 10px; bottom: 10px; }
    .tile figcaption small { display: none; }
    .tile .multi { top: 8px; right: 8px; padding: 2px 7px; font-size: 10px; }
  }
  @container (max-width: 200px) {
    .tile figcaption { font-size: 11px; padding: 4px 8px; left: 8px; bottom: 8px; letter-spacing: .04em; }
    .dots { bottom: 10px; }
  }  /* 有多張照片的作品：右上角顯示張數 */
  .tile .multi { position: absolute; top: 10px; right: 10px; display: flex; align-items: center; gap: 5px; padding: 3px 8px; border-radius: 999px; font-size: 11px; letter-spacing: .06em; color: var(--ink); background: rgba(245,244,242,.8); -webkit-backdrop-filter: blur(8px); backdrop-filter: blur(8px); pointer-events: none; }
  .tile .multi svg { width: 11px; height: 11px; }
  .v-info { display: none; }
  @media (max-width: 760px) {
    .wall { column-gap: 8px; }
    .tile { margin-bottom: 8px; }
    .zoom input { width: 90px; }
  }
</style>

<script>
  // 觸控裝置：第一下只顯示霧面和名稱，第二下才交給放大瀏覽（js/viewer.js）
  if (matchMedia('(hover: none)').matches) {
    const tiles = [...document.querySelectorAll('.tile')];
    tiles.forEach(t => {
      t.querySelector('figcaption').insertAdjacentHTML('beforeend', '<span class="hint">再點一下放大</span>');
      t.addEventListener('click', e => {
        if (t.classList.contains('show')) { t.classList.remove('show'); return; }
        e.stopPropagation(); e.preventDefault();
        tiles.forEach(x => x.classList.toggle('show', x === t));
      }, true);
    });
  }
</script>
<script>
  // 大小滑桿：值越大、圖越大（欄數 = 最大欄數 + 1 − 值）；每次打開頁面都從預設大小開始
  (() => {
    const wall = document.querySelector('.wall'), range = document.querySelector('.zoom input');
    const tiles = [...wall.querySelectorAll('.tile')], imgs = tiles.map(t => t.querySelector('img'));
    const narrow = matchMedia('(max-width: 760px)').matches;
    const maxCols = narrow ? 3 : 5, cols0 = narrow ? 2 : 3;
    range.max = maxCols; range.value = maxCols + 1 - cols0;
    const apply = cols => {
      wall.style.setProperty('--cols', cols);
      const vw = Math.ceil(100 / cols);
      imgs.forEach(i => i.sizes = `${vw}vw`);              // 圖變大時改載清晰的大圖
    };
    apply(cols0);
    let tr = null, current = cols0;
    const colsOf = v => maxCols + 1 - Math.round(v);
    // 拖動時滑桿連續移動，欄數只在跨過中間點時才切換（欄數沒變就不重跑動畫）
    range.addEventListener('input', () => {
      const cols = colsOf(parseFloat(range.value));
      if (cols === current) return;
      current = cols;
      if (!document.startViewTransition || matchMedia('(prefers-reduced-motion: reduce)').matches) { apply(cols); return; }
      if (tr) tr.skipTransition();
      tiles.forEach((t, i) => { t.style.viewTransitionName = 'tile-' + i; t.style.viewTransitionClass = 'tile'; });
      tr = document.startViewTransition(() => apply(cols));
      tr.finished.finally(() => { tiles.forEach(t => { t.style.viewTransitionName = ''; t.style.viewTransitionClass = ''; }); tr = null; });
    });
    // 放開後，滑桿輕輕滑到最接近的那一格
    range.addEventListener('change', () => {
      const from = parseFloat(range.value), to = Math.round(from), t0 = performance.now();
      const step = now => {
        const k = Math.min(1, (now - t0) / 180), e = 1 - Math.pow(1 - k, 3);
        range.value = from + (to - from) * e;
        if (k < 1) requestAnimationFrame(step);
      };
      requestAnimationFrame(step);
    });  })();
</script>
<script>
  // 卡片裡的照片列：左右滑動（觸控板、手指、滑鼠拖曳），更新小圓點；輕點則從目前這張打開放大瀏覽
  document.querySelectorAll('.has-strip').forEach(tile => {
    const strip = tile.querySelector('.strip'), dots = [...tile.querySelectorAll('.dots i')], cover = strip.querySelector('img[data-viewer]');
    const cur = () => Math.round(strip.scrollLeft / strip.clientWidth);
    const mark = () => dots.forEach((d, i) => d.classList.toggle('on', i === cur()));
    mark(); strip.addEventListener('scroll', mark, { passive: true });
    let drag = null, moved = false;
    strip.addEventListener('pointerdown', e => { if (e.pointerType !== 'mouse' || e.button) return; drag = { x: e.clientX, left: strip.scrollLeft }; moved = false; });
    addEventListener('pointermove', e => {
      if (!drag) return;
      const dx = e.clientX - drag.x;
      if (!moved && Math.abs(dx) > 5) { moved = true; strip.classList.add('dragging'); }
      if (moved) strip.scrollLeft = drag.left - dx;
    });
    addEventListener('pointerup', e => {
      if (!drag) return;
      const dx = e.clientX - drag.x, start = Math.round(drag.left / strip.clientWidth); drag = null;
      if (!moved) return;
      strip.classList.remove('dragging');
      const to = Math.max(0, Math.min(dots.length - 1, dx < -40 ? start + 1 : dx > 40 ? start - 1 : start));
      strip.scrollTo({ left: to * strip.clientWidth, behavior: 'smooth' });
    });
    strip.addEventListener('dragstart', e => e.preventDefault());
    // 點擊：拖曳後不算；否則從目前這張打開
    strip.addEventListener('click', e => {
      e.preventDefault(); e.stopPropagation();
      if (moved) { moved = false; return; }
      tile.classList.remove('show');
      cover.dispatchEvent(new CustomEvent('viewer:open', { detail: cur() }));
    }, true);
  });
</script>
