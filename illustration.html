<!DOCTYPE html>
<html lang="zh-Hant">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>插畫 Illustration｜REBECCA CHU</title>
<meta name="description" content="REBECCA CHU 插畫作品。">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Noto+Sans+TC:wght@300;400;500;700&family=Inter:wght@300;400;600&display=swap" rel="stylesheet">
<link rel="stylesheet" href="css/project.css">
<link rel="stylesheet" href="css/viewer.css">
<style>
  /* 沒有刊頭的頁面：導覽列一開始就是實心、跟著頁面捲動 */
  header { position: sticky; }
  /* 分類頁開頭（平面設計、插畫共用）：英文分類名 */
  .page-title { padding: clamp(48px, 7vw, 96px) var(--gutter) 0; max-width: 1440px; margin: 0 auto; }
  .page-title h1 { font-family: "Inter", sans-serif; font-weight: 300; font-size: clamp(28px, 3.2vw, 44px); line-height: 1.15; letter-spacing: .04em; }

  /* 瀑布流：依每張插畫的原比例錯落排列，圓角、較小的間距 */
  .wall { columns: 2 380px; column-gap: 12px; padding: 40px var(--gutter) 120px; max-width: 1440px; margin: 0 auto; }
  .tile { break-inside: avoid; margin-bottom: 12px; position: relative; overflow: hidden; border-radius: var(--r); }
  .tile img { transition: transform .8s cubic-bezier(.2,.7,.2,1); }
  /* 滑過去時：整張插畫蒙上一層霧面玻璃，作品名稱清楚浮在中間 */
  .tile figcaption {
    position: absolute; inset: 0; margin: 0; pointer-events: none;
    display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 4px;
    color: var(--ink); font-family: "Noto Sans TC"; font-size: 16px; font-weight: 500; letter-spacing: .12em;
    background: rgba(245,244,242,.38);
    -webkit-backdrop-filter: blur(8px) saturate(1.1); backdrop-filter: blur(8px) saturate(1.1);
    opacity: 0; transition: opacity .5s ease;
  }
  .tile figcaption small { font-size: 11px; font-weight: 400; letter-spacing: .2em; color: #5f5d58; }
  .tile figcaption .hint { display: none; margin-top: 10px; font-size: 11px; font-weight: 400; letter-spacing: .2em; color: #5f5d58; }
  @media (hover: hover) { .tile:hover figcaption { opacity: 1; } .tile:hover img { transform: scale(1.03); } }
  /* 觸控裝置沒有「滑過去」：點第一下出現霧面，再點一下放大 */
  @media (hover: none) {
    .tile.show figcaption { opacity: 1; }
    .tile figcaption .hint { display: block; }
  }
</style>
</head>
<body>

<header class="solid">
  <a class="logo" href="./">REBECCA CHU</a>
  <nav><a href="./">平面設計<span class="en">Graphic</span></a><a href="illustration.html" class="active">插畫<span class="en">Illustration</span></a></nav>
</header>

<section class="page-title">
  <h1>Illustration</h1>
</section>

<section class="wall">
  <!-- tiles:start -->
  <figure class="tile"><img data-viewer="works/illustration/il-68f68974.jpg" src="works/illustration/il-68f68974.jpg" srcset="works/illustration/il-68f68974-sm.jpg 800w, works/illustration/il-68f68974.jpg 1600w" sizes="(max-width: 760px) 92vw, 45vw" width="1600" height="1136" alt="樹洞一號" loading="lazy" decoding="async"><figcaption>樹洞一號<small>2026　賀卡</small></figcaption></figure>
  <figure class="tile"><img data-viewer="works/illustration/il-edb847fd.jpg" src="works/illustration/il-edb847fd.jpg" srcset="works/illustration/il-edb847fd-sm.jpg 800w, works/illustration/il-edb847fd.jpg 1600w" sizes="(max-width: 760px) 92vw, 45vw" width="1600" height="1136" alt="樹洞二號" loading="lazy" decoding="async"><figcaption>樹洞二號<small>2026　賀卡</small></figcaption></figure>
  <!-- tiles:end -->
</section>

<footer>© 2026 REBECCA CHU</footer>

<script>
  // 觸控裝置：第一下只顯示霧面和名稱，第二下才交給放大瀏覽（js/viewer.js）
  if (matchMedia('(hover: none)').matches) {
    const tiles = [...document.querySelectorAll('.tile')];
    tiles.forEach(t => {
      t.querySelector('figcaption').insertAdjacentHTML('beforeend', '<span class="hint">再點一下放大</span>');
      t.addEventListener('click', e => {
        if (t.classList.contains('show')) { t.classList.remove('show'); return; }
        e.stopPropagation(); e.preventDefault();
        tiles.forEach(x => x.classList.toggle('show', x === t));
      }, true);
    });
  }
</script>
<script src="js/viewer.js"></script>
<script src="js/blur-up.js"></script>
<script src="js/nav.js"></script>
</body>
</html>
