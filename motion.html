<!DOCTYPE html>
<html lang="zh-Hant">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>影像 Motion｜REBECCA CHU</title>
<meta name="description" content="REBECCA CHU 影像與動態作品。">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Noto+Sans+TC:wght@300;400;500;700&family=Inter:wght@300;400;600&display=swap" rel="stylesheet">
<link rel="preconnect" href="https://player.vimeo.com">
<link rel="stylesheet" href="css/project.css">
<style>
  /* 沒有刊頭的頁面：導覽列一開始就是實心、跟著頁面捲動 */
  header { position: sticky; }
  .page-title { padding: clamp(40px, 6vw, 80px) var(--gutter) 0; max-width: 1440px; margin: 0 auto; }
  .page-title h1 { font-family: "Inter", sans-serif; font-weight: 300; font-size: clamp(28px, 3.2vw, 44px); line-height: 1.15; letter-spacing: .04em; }
  .wrap { max-width: 1280px; margin: 0 auto; padding: 32px var(--gutter) 120px; }

  /* ---------- 播放區：左右滑動切換影片 ---------- */
  .stage { position: relative; }
  .track {
    display: flex; overflow-x: auto; scroll-snap-type: x mandatory; scrollbar-width: none;
    transition: height .45s cubic-bezier(.2,.7,.2,1);
  }
  .track::-webkit-scrollbar { display: none; }
  .slide { position: relative; flex: 0 0 100%; scroll-snap-align: center; scroll-snap-stop: always; display: flex; align-items: flex-start; justify-content: center; }
  /* 點影片以外的左右空白處切換影片 */
  .slide.can-prev, .slide.can-next { cursor: pointer; }
  .frame { position: relative; overflow: hidden; border-radius: var(--r); cursor: pointer; background: #1d1d1b; }
  .frame img { width: 100%; height: 100%; object-fit: cover; -webkit-user-drag: none; user-select: none; }
  .track { user-select: none; }
  .frame iframe { position: absolute; inset: 0; width: 100%; height: 100%; border: 0; }
  .play {
    position: absolute; left: 50%; top: 50%; width: 68px; height: 68px; margin: -34px 0 0 -34px; border-radius: 50%;
    display: flex; align-items: center; justify-content: center; padding-left: 4px;
    color: var(--ink); font-size: 20px; border: 1px solid rgba(255,255,255,.6);
    background: rgba(245,244,242,.55); -webkit-backdrop-filter: blur(12px); backdrop-filter: blur(12px);
    transition: transform .3s ease, background .3s;
  }
  @media (hover: hover) { .frame:hover .play { transform: scale(1.08); background: rgba(245,244,242,.8); } }
  .frame.playing { cursor: default; }
  .frame.playing .play, .frame.playing img { display: none; }

  /* ---------- 影片資訊：跟著播放區切換 ---------- */
  .now { padding: 20px 2px 0; }
  .now h2 { font-family: "Noto Sans TC"; font-weight: 500; font-size: clamp(18px, 2vw, 22px); letter-spacing: .05em; }
  .now .sub { display: block; margin-top: 4px; font-size: 13px; letter-spacing: .1em; color: var(--muted); font-family: "Noto Sans TC"; }
  .now-body { transition: opacity .25s ease; }
  .now-body.fade { opacity: 0; }
  .info { margin-top: 0; }
  .info summary { list-style: none; cursor: pointer; display: flex; justify-content: space-between; align-items: flex-start; gap: 16px; padding: 0 0 14px; user-select: none; }
  .info summary .lbl { display: flex; align-items: center; gap: 12px; padding-top: 6px; font-size: 12px; letter-spacing: .2em; color: var(--muted); white-space: nowrap; }
  .info summary::-webkit-details-marker { display: none; }
  .info summary:hover .lbl { color: var(--ink); }
  .info summary i { position: relative; width: 11px; height: 11px; }
  .info summary i::before, .info summary i::after { content: ""; position: absolute; left: 0; top: 5px; width: 11px; height: 1px; background: currentColor; transition: transform .3s ease; }
  .info summary i::after { transform: rotate(90deg); }
  .info[open] summary i::after { transform: rotate(0deg); }
  .info-body { display: grid; grid-template-columns: minmax(220px, 1fr) 2fr; gap: 8px 64px; padding: 6px 0 8px; }
  .info .meta { margin: 0; }
  .info-body.no-desc { grid-template-columns: 1fr; }
  .info .desc p { font-size: 15px; }
  .todo { color: #b4762f; }
  @supports (interpolate-size: allow-keywords) {
    .info { interpolate-size: allow-keywords; }
    .info::details-content { block-size: 0; overflow: hidden; transition: block-size .4s ease, content-visibility .4s allow-discrete; }
    .info[open]::details-content { block-size: auto; }
  }

  /* ---------- 總覽：點選切換影片 ---------- */
  .all { margin-top: clamp(56px, 7vw, 88px); }
  .all h3 { font-size: 12px; font-weight: 400; letter-spacing: .22em; color: var(--muted); margin-bottom: 18px; }
  /* 每張縮圖依影片原始比例、同樣高度排成一排（直式就是直式） */
  .grid { --th: 240px; display: flex; flex-wrap: wrap; gap: 28px 14px; }
  .card { flex: 0 0 auto; width: calc(var(--th) * var(--ratio)); text-align: left; background: none; border: 0; padding: 0; cursor: pointer; font: inherit; color: inherit; }
  .card .thumb { position: relative; height: var(--th); border-radius: var(--r); overflow: hidden; background: #e9e7e3; }
  .card .thumb img { width: 100%; height: 100%; object-fit: cover; transition: transform .8s cubic-bezier(.2,.7,.2,1); }
  .card .thumb .dur { position: absolute; right: 8px; bottom: 8px; padding: 2px 7px; border-radius: 6px; font-size: 11px; letter-spacing: .06em; color: #fff; background: rgba(0,0,0,.55); }
  .card .thumb .now-tag { position: absolute; left: 8px; top: 8px; padding: 3px 8px; border-radius: 6px; font-size: 10px; letter-spacing: .18em; color: var(--ink); background: rgba(245,244,242,.85); display: none; }
  .card.on .thumb { outline: 2px solid var(--ink); outline-offset: 3px; }
  .card.on .now-tag { display: block; }
  @media (hover: hover) { .card:hover .thumb img { transform: scale(1.04); } }
  .card b { display: -webkit-box; -webkit-line-clamp: 2; -webkit-box-orient: vertical; overflow: hidden; margin-top: 12px; font-family: "Noto Sans TC"; font-weight: 500; font-size: 14px; line-height: 1.5; letter-spacing: .04em; }
  @media (max-width: 760px) {
    .info-body { grid-template-columns: 1fr; gap: 16px; }
    .grid { --th: 180px; gap: 20px 10px; }
    .play { width: 54px; height: 54px; margin: -27px 0 0 -27px; font-size: 16px; }
  }
</style>
</head>
<body>

<header class="solid">
  <a class="logo" href="./">REBECCA CHU</a>
  <nav><a href="./">Graphic<span class="long"> Design</span></a><a href="illustration.html">Illustration</a><a href="motion.html" class="active">Motion</a></nav>
</header>

<section class="page-title">
  <h1>Motion</h1>
</section>

<main class="wrap">
  <div class="stage">
    <div class="track" aria-live="polite"></div>
  </div>

  <section class="now">
    <div class="now-body"></div>
  </section>

  <section class="all">
    <h3>ALL VIDEOS</h3>
    <div class="grid"></div>
  </section>
</main>

<footer>© 2026 REBECCA CHU</footer>

<script>
  // ===== 影片清單：新增影片時，在這裡加一筆就好 =====
  // id：Vimeo 影片編號　ratio：影片比例（直式 9/16、橫式 16/9）
  // meta：資訊欄的項目　desc：作品介紹（可留空）
  const VIDEOS = [
    { id: '1245437306', title: '2027 更大的敘事 EP01', ratio: 9 / 16, duration: '0:45', sub: '動態設計・直式短片',
      meta: [['類別', '動態設計／直式短片'], ['年份', '2026'], ['工具', 'Illustrator、Premiere、Claude']],
      desc: '' },
    { id: '1245437307', title: '2027 更大的敘事 EP02', ratio: 9 / 16, duration: '1:00', sub: '動態設計・直式短片',
      meta: [['類別', '動態設計／直式短片'], ['年份', '2026'], ['工具', 'Illustrator、Premiere、Claude']],
      desc: '' },
    { id: '427283787', title: 'Hey Brother', ratio: 16 / 9, duration: '1:13', sub: '2D 手繪動畫',
      meta: [['類別', '2D 手繪動畫'], ['年份', '2020'], ['編舞', 'Dylan Mayoral'], ['音樂', 'Avicii “Hey Brother”'], ['繪製', 'Rebecca Chu']],
      desc: '' },
  ];
  const cover = (v, size) => `works/motion/v-${v.id}${size === 'sm' ? '-sm' : ''}.jpg`;
  const esc = s => String(s).replace(/[&<>"]/g, c => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;' }[c]));
  const val = s => s === '待補' ? '<span class="todo">待補</span>' : esc(s);

  const track = document.querySelector('.track'), body = document.querySelector('.now-body'), grid = document.querySelector('.grid');

  // 建立播放區的每一張投影片
  VIDEOS.forEach((v, n) => {
    const s = document.createElement('div'); s.className = 'slide';
    s.innerHTML = `<div class="frame" role="button" tabindex="0" aria-label="播放 ${esc(v.title)}">
        <img src="${cover(v)}" alt="${esc(v.title)} 封面" ${n ? 'loading="lazy"' : ''}><span class="play">▶</span></div>`;
    track.appendChild(s);
    const frame = s.querySelector('.frame');
    const start = () => {
      if (frame.classList.contains('playing')) return;
      stopAll();
      const f = document.createElement('iframe');
      f.src = `https://player.vimeo.com/video/${v.id}?autoplay=1&title=0&byline=0&portrait=0&dnt=1`;
      f.allow = 'autoplay; fullscreen; picture-in-picture'; f.allowFullscreen = true; f.title = v.title;
      frame.appendChild(f); frame.classList.add('playing');
    };
    frame.addEventListener('click', start);
    frame.addEventListener('keydown', e => { if (e.key === 'Enter' || e.key === ' ') { e.preventDefault(); start(); } });

    // 總覽卡片
    const c = document.createElement('button'); c.className = 'card'; c.type = 'button'; c.style.setProperty('--ratio', v.ratio);
    c.innerHTML = `<div class="thumb"><img src="${cover(v, 'sm')}" alt="" loading="lazy"><span class="now-tag">NOW</span><span class="dur">${v.duration}</span></div>`;
    c.setAttribute('aria-label', v.title);
    c.addEventListener('click', () => { go(n); document.querySelector('.stage').scrollIntoView({ behavior: 'smooth', block: 'start' }); });
    grid.appendChild(c);
  });
  const slides = [...track.children], frames = slides.map(s => s.querySelector('.frame')), cards = [...grid.children];

  // 影片依比例縮放到播放區裡（直式、橫式都完整顯示）
  const maxH = () => Math.min(innerHeight * (innerWidth <= 760 ? .7 : .78), 720);
  const mouse = matchMedia('(hover: hover)').matches;
  // 有滑鼠的裝置：影片左右各留一段空白，點空白處可以切換；手機用滑的，維持滿寬
  const sizeOf = n => { const r = VIDEOS[n].ratio, W = track.clientWidth - (mouse ? 2 * Math.max(56, track.clientWidth * .06) : 0), w = Math.min(W, maxH() * r); return [w, w / r]; };
  const fit = () => {
    slides.forEach((s, n) => { const [w, h] = sizeOf(n); frames[n].style.width = w + 'px'; frames[n].style.height = h + 'px'; });
    if (index >= 0) track.style.height = sizeOf(index)[1] + 'px';
  };
  addEventListener('resize', fit);

  function stopAll() { frames.forEach(f => { const i = f.querySelector('iframe'); if (i) i.remove(); f.classList.remove('playing'); }); }

  // 更新下方資訊和總覽
  let index = -1;
  function show(n) {
    if (n === index) return;
    const first = index === -1; index = n; stopAll();
    track.style.height = sizeOf(n)[1] + 'px';
    const v = VIDEOS[n];
    const render = () => {
      body.innerHTML = `
        <details class="info"${document.querySelector('.info[open]') ? ' open' : ''}>
          <summary>
            <span class="t"><h2>${esc(v.title)}</h2><span class="sub">${esc(v.sub)}</span></span>
            <span class="lbl">INFO<i></i></span>
          </summary>
          <div class="info-body${v.desc ? '' : ' no-desc'}">
            <ul class="meta">${v.meta.map(([k, x]) => `<li><span>${esc(k)}</span><span>${val(x)}</span></li>`).join('')}</ul>
            ${v.desc ? `<div class="desc"><p>${esc(v.desc)}</p></div>` : ''}
          </div>
        </details>`;
      body.classList.remove('fade');
    };
    if (first) render(); else { body.classList.add('fade'); setTimeout(render, 200); }
    cards.forEach((c, i) => c.classList.toggle('on', i === n));
    slides.forEach((s, i) => { s.classList.toggle('can-prev', i === n && n > 0); s.classList.toggle('can-next', i === n && n < VIDEOS.length - 1); });
    history.replaceState(null, '', '#' + v.id);
  }
  function go(n) {
    n = Math.max(0, Math.min(VIDEOS.length - 1, n));
    track.scrollTo({ left: slides[n].offsetLeft, behavior: 'smooth' });
    if (n !== index) show(n);
  }
  // 點影片以外的左半邊 → 上一支，右半邊 → 下一支
  slides.forEach(s => s.addEventListener('click', e => {
    if (e.target.closest('.frame')) return;
    const r = s.getBoundingClientRect();
    go(e.clientX < r.left + r.width / 2 ? index - 1 : index + 1);
  }));
  addEventListener('keydown', e => {
    if (e.target.closest('input, textarea')) return;
    if (e.key === 'ArrowLeft') go(index - 1);
    if (e.key === 'ArrowRight') go(index + 1);
  });

  // 滑鼠拖曳切換：按住左右拖超過一點距離就換片，輕點則照常播放
  let drag = null, dragged = false;
  track.addEventListener('pointerdown', e => {
    if (e.pointerType !== 'mouse' || e.button !== 0) return;
    drag = { x: e.clientX, left: track.scrollLeft }; dragged = false;
  });
  addEventListener('pointermove', e => {
    if (!drag) return;
    const dx = e.clientX - drag.x;
    if (!dragged && Math.abs(dx) > 6) { dragged = true; track.style.scrollSnapType = 'none'; track.style.cursor = 'grabbing'; }
    if (dragged) track.scrollLeft = drag.left - dx;
  });
  addEventListener('pointerup', e => {
    if (!drag) return;
    const dx = e.clientX - drag.x; drag = null;
    if (!dragged) return;
    track.style.cursor = '';
    const target = dx < -60 ? index + 1 : dx > 60 ? index - 1 : index;
    track.style.scrollSnapType = '';
    go(target);
  });
  // 拖曳結束時不要觸發「播放」或「切換」的點擊
  track.addEventListener('click', e => { if (dragged) { e.stopPropagation(); e.preventDefault(); dragged = false; } }, true);
  track.addEventListener('dragstart', e => e.preventDefault());
  // 手指或觸控板滑動後，判斷停在哪一支
  let t;
  track.addEventListener('scroll', () => {
    clearTimeout(t);
    t = setTimeout(() => show(Math.round(track.scrollLeft / track.clientWidth)), 90);
  }, { passive: true });

  // 網址帶有 #影片編號 時，直接打開那一支（方便分享特定影片）
  const start = Math.max(0, VIDEOS.findIndex(v => '#' + v.id === location.hash));
  fit(); show(start);
  requestAnimationFrame(() => { track.scrollLeft = slides[start].offsetLeft; });
</script>
<script src="js/nav.js"></script>
</body>
</html>
